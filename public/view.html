<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex">
<title>Portfolio</title>
<style>
html,body{margin:0}
.empty{min-height:100svh;display:grid;place-items:center;padding:24px;font:17px/1.55 system-ui,sans-serif;background:#fbfbf2;color:#13242e;text-align:center}
.empty h1{font-size:28px;margin:0 0 8px}
.empty p{margin:0 0 20px;color:#4a5b63}
.empty a,.made{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:#d6127e;color:#fff;text-decoration:none;font:700 15px system-ui,sans-serif}
.made{position:fixed;right:16px;bottom:16px;z-index:10;background:#13242e;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="portfolio"></div>
<div class="empty" id="empty" hidden><div>
  <h1>This link has no portfolio in it</h1>
  <p>The link may have been cut short when it was copied.</p>
  <a href="index.html">Build a portfolio</a>
</div></div>
<a class="made" id="made" href="index.html" hidden>Build your own</a>
<script src="plugin/resume-portfolio.js"></script>
<script>
ResumePortfolio.mountShared(document.getElementById('portfolio')).then(shown => {
  document.getElementById(shown ? 'made' : 'empty').hidden = false;
});
</script>
</body>
</html>
