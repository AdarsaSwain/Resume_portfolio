<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Embed demo: the builder inside another site</title>
<style>
/* A stand-in for your future site: its own fonts and colours, nothing shared with the plugin. */
body{margin:0;font:17px/1.6 Georgia,serif;background:#f3f1ff;color:#1d1a3a}
header{background:#1d1a3a;color:#fff;padding:20px max(4vw,16px)}
header b{font-size:20px}
main{max-width:1200px;margin:0 auto;padding:32px max(4vw,16px) 64px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 8px}
.lede{margin:0 0 28px;max-width:60ch}
.log{margin-top:24px;padding:16px;border-radius:12px;background:#fff;border:1px solid #d9d5f5;font:14px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<header><b>Your future site</b></header>
<main>
  <h1>Careers: build your portfolio</h1>
  <p class="lede">Everything below this line is the plugin, added with one script tag and one element. The box at the bottom shows the events it sends to this page.</p>

  <resume-portfolio theme="midnight" accent="#6d3fd8" storage-key="embed-demo"></resume-portfolio>

  <div class="log" id="log" aria-live="polite">Waiting for events. Press Build portfolio or Copy share link.</div>
</main>

<script src="plugin/resume-portfolio.js"></script>
<script>
const log = document.getElementById('log');
document.addEventListener('portfolio-built', e => {
  const d = e.detail;
  log.textContent = `portfolio-built\n  source: ${d.source}\n  name: ${d.data.name}\n  sections: ${d.data.experience.length} roles, ${d.data.projects.length} projects, ${d.data.skills.length} skill groups\n  html: ${d.html.length} characters`;
});
document.addEventListener('portfolio-shared', e => {
  log.textContent = `portfolio-shared\n  url: ${e.detail.url.slice(0, 90)}…`;
});
</script>
</body>
</html>
